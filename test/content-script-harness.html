<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>GrindPilot content-script harness</title></head>
  <body style="margin:0;background:#20251e;color:#eef5e8;font-family:system-ui">
    <main style="padding:32px">
      <h1>Content-script test surface</h1><p>No EA account or network session is used.</p>
      <section class="ut-store-pack-details-view" data-pack-id="content-owned-pack">
        <h2>Premium Electrum Players Pack</h2>
        <img alt="Premium Electrum Players Pack" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
        <div class="ea-pack-actions"><button class="call-to-action">Open</button></div>
      </section>
      <section class="ut-unassigned-view">
        <header class="ut-unassigned-header"><h2>Items</h2><button class="ea-more-menu" aria-label="More options">⋮</button></header>
      </section>
    </main>
    <script>
      const state = { activeRun:null, activity:[], profiles:{}, projects:[], settings:{} };
      const verified = (value) => ({ status:"verified", value, at:Date.now() });
      const eaController = {
        getHealth: () => verified({ eaReady:true, bridgeReady:true, storeAvailable:true, itemMoveAvailable:true }),
        getCapabilityHealth: () => verified([{ id:"inventory", status:"AVAILABLE", evidence:{ harness:true } }]),
        getContext: () => ({ setId:"test-set", setName:"Test SBC", challengeId:"content-script-test", challengeName:"85+ Upgrade" }),
        readInventory: () => verified({ club:[], storage:[], unassigned:[] }),
        readCurrentSbcProject: () => verified({ setId:"test-set", setName:"Test SBC", challenges:[{ id:"content-script-test", name:"85+ Upgrade", completed:false, requiredSquadRating:85, specialCardRequirements:[], unknownRequirements:[] }] }),
        readLegacySequences: () => verified([]),
        solveCurrentSbc: () => verified({ challengeId:"content-script-test", submitReady:true, solutionIds:[] }),
        listOwnedRewardPacks: () => verified([{ id:"content-owned-pack", packName:"Premium Electrum Players Pack", count:1, isReward:true }]),
        readPlayerPick: () => verified({ pending:false, pickItemIds:[] }),
      };
      const originalAppendChild = Element.prototype.appendChild;
      Element.prototype.appendChild = function (node) {
        if (node?.tagName === "SCRIPT" && String(node.src).includes("page/ea-data-bridge.js")) {
          queueMicrotask(() => node.onload?.());
          return node;
        }
        return originalAppendChild.call(this, node);
      };

      window.chrome = { runtime: {
        lastError:null,
        getManifest: () => ({ version:"2.2.0" }),
        getURL: (path = "") => new URL(`../${path}`, location.href).href,
        sendMessage(message, callback) {
          if (message?.type === "EA_GRINDPILOT_RPC_INSTALL" || message?.type === "EA_PAGE_BRIDGE_INJECT") {
            queueMicrotask(() => callback({ ok:true, data:{ installed:true, injected:true } }));
            return;
          }
          if (message?.type === "EA_GRINDPILOT_RPC_CALL_V2") {
            queueMicrotask(async () => {
              try {
                const operation = eaController[message.method];
                if (typeof operation !== "function") throw new Error(`Unavailable test operation: ${message.method}`);
                callback({ ok:true, value:await operation(message.payload) });
              } catch (error) { callback({ ok:false, error:{ message:error.message } }); }
            });
            return;
          }
          if (message?.type !== "GRINDPILOT_STATE_COMMAND_V2") {
            queueMicrotask(() => callback({ ok:false, error:{ code:"TEST_COMMAND_UNKNOWN", message:"Unknown test command" } }));
            return;
          }
          const input = message.payload || {};
          let data = null;
          if (message.action === "BOOTSTRAP_LOAD") data = { activity:state.activity, projects:state.projects, settings:state.settings };
          else if (message.action === "SETTINGS_SAVE") data = state.settings = structuredClone(input.value);
          else if (message.action === "ACTIVITY_SAVE") data = state.activity = structuredClone(input.value);
          else if (message.action === "PROJECTS_SAVE") data = state.projects = structuredClone(input.value);
          else if (message.action === "PROFILE_LIST") data = Object.values(state.profiles);
          else if (message.action === "PROFILE_GET") data = state.profiles[input.id] || null;
          else if (message.action === "PROFILE_PUT") data = state.profiles[input.profile.id] = structuredClone(input.profile);
          else if (message.action === "PROFILE_DELETE") data = delete state.profiles[input.id];
          else if (["RUN_LOAD_ACTIVE", "RUN_LOAD"].includes(message.action)) data = state.activeRun;
          else if (message.action === "RUN_CREATE") data = state.activeRun = structuredClone(input.run);
          else if (message.action === "RUN_SAVE") data = state.activeRun = structuredClone(input.run);
          else if (message.action === "RUN_ASSERT_OWNER") data = true;
          else if (message.action === "RUN_CLEAR") data = state.activeRun = null;
          else {
            callback({ ok:false, error:{ code:"TEST_ACTION_UNKNOWN", message:`Unknown test action ${message.action}` } });
            return;
          }
          queueMicrotask(() => callback({ ok:true, data }));
        },
      }};
    </script>
    <script src="../content-script.js"></script>
    <script src="../src/generated/grindpilot-content-bundle.js"></script>
  </body>
</html>
