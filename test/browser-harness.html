<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>GrindPilot browser harness</title></head>
  <body style="margin:0;background:#20251e;color:#eef5e8;font-family:system-ui">
    <main style="padding:32px"><h1>EA Web App test surface</h1><p>Safe local browser harness; no EA account or network session is used.</p></main>
    <script>
      const values = new Map();
      window.addEventListener("message", (event) => {
        const data = event.data;
        if (event.source !== window || data?.type !== "GRINDPILOT_STORAGE_REQUEST_V1") return;
        let result = null;
        if (data.operation === "GET") result = values.get(data.key) ?? null;
        if (data.operation === "SET") { values.set(data.key, structuredClone(data.value)); result = true; }
        if (data.operation === "REMOVE") { values.delete(data.key); result = true; }
        window.postMessage({ type:"GRINDPILOT_STORAGE_RESPONSE_V1", source:"grindpilot-fc26", requestId:data.requestId, ok:true, data:result }, "*");
      }, true);
      const verified = (value) => ({ status:"verified", value, at:Date.now() });
      window.eaData = { grindPilot: {
        getHealth: () => verified({ eaReady:true, bridgeReady:true, storeAvailable:true, itemMoveAvailable:true }),
        getContext: () => ({ setName:"Test SBC", challengeName:"85+ Upgrade" }),
        readInventory: () => verified({ club:[], storage:[], unassigned:[] }),
        listOwnedRewardPacks: () => verified([]),
        readPlayerPick: () => verified({ pending:false, pickItemIds:[] }),
      }};
    </script>
    <script type="module" src="../src/grindpilot-main.js"></script>
  </body>
</html>
